  <main class="container contatti">
    <h1>Contattami</h1>
    <p>Scrivimi un messaggio e ti rispondo appena possibile.</p>

    <form class="form-contatti" action="#" method="post">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" id="nome" name="nome" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="oggetto" class="form-label">Oggetto</label>
        <input type="text" id="oggetto" name="oggetto" class="form-control">
      </div>

      <div class="mb-3">
        <label for="messaggio" class="form-label">Messaggio</label>
        <textarea id="messaggio" name="messaggio" class="form-control" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn-invia">Invia messaggio</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
